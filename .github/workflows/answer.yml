# Skill-competition answers from the site: Write answer / Edit opens a pre-filled issue "answer: <id>" with the
# question and a "---" line; the owner writes the answer below it and submits. When the repository owner submits it,
# this saves the answer in data/entries/answers.json if it fits the word limit (workers/answers.py), comments the
# result and closes the issue; the next entry run (or Submit all approved) enters it. Others' issues are ignored.
name: answer
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: answer
  cancel-in-progress: false
jobs:
  answer:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'answer')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Save the answer
        run: |
          printf '%s' "$ISSUE_BODY" | python3 -m workers.answers "$ISSUE_TITLE" > "$RUNNER_TEMP/result.txt" || true
          cat "$RUNNER_TEMP/result.txt"
      - name: Commit, report and close the issue
        run: |
          git config user.name "lotto-entries-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries/answers.json
          if ! git diff --cached --quiet; then
            git commit -q -m "answer: issue #$ISSUE_NUMBER"
            for i in 1 2 3 4; do
              git pull -q --rebase -X theirs origin main && git push -q && break
              git rebase --abort 2>/dev/null; sleep $((i * 5))
            done
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(cat "$RUNNER_TEMP/result.txt")"
          gh issue close "$ISSUE_NUMBER"
          gh workflow run site.yml --ref main || true
