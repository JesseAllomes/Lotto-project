# The comps page on Cloudflare Pages behind Cloudflare Access (only the owner's email). Runs on demand and after the
# site workflow's build inputs change; workers/cloudflare.py sets up the project and the Access app (idempotent) and
# wrangler deploys. Prints only outcomes, never secrets. Token secret: CLOUDFLARE_API (owner's name "cloudflare-api").
name: cloudflare
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [comps, entries, reenter, remove, answer]
    types: [completed]
  schedule:
    - cron: "41 */2 * * *"
permissions:
  contents: read
concurrency:
  group: cloudflare
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API || secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      ACCESS_EMAIL: ${{ secrets.ENTRANT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Token, Pages project and Access login
        run: python3 -m workers.cloudflare setup
      - name: Build the page
        run: |
          python3 -m workers.freebies || true
          python3 -m workers.winners || true
          python3 -m workers.site --out site
      - name: Deploy to Cloudflare Pages
        run: |
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID=$(python3 -c "import workers.cloudflare as c; print(c.account())")
          npx --yes wrangler@3 pages deploy site --project-name comp-quest --branch main --commit-dirty=true 2>&1 | grep -v -i "token" | tail -5
