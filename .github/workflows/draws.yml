# Winning-numbers register (workers/draws.py): adds each new draw of The Lott's draw games.
# Daily at 12:23 UTC (about 11:23pm Melbourne in summer), after the evening draws. Token-free.
name: draws
# Runs on Azure now (azure/jobs/lotto-draws.json). Kept as a manual fallback only: run it by hand with
# manual = yes, and only while the Azure job is parked, or the work is done twice.
on:
  workflow_dispatch:
    inputs:
      manual:
        description: "yes = run on GitHub (only while the Azure job is parked)"
        default: "no"
permissions:
  contents: write
concurrency:
  group: draws
  cancel-in-progress: false
jobs:
  update:
    if: github.event.inputs.manual == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch new draws
        run: python3 -m workers.draws
      - name: Commit the register
        run: |
          git config user.name "lotto-draws-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws
          git diff --cached --quiet || git commit -m "draws: register update $(date -u +%F)"
          git push
