# Re-enter on request: the site's Re-enter button opens a pre-filled issue "reenter: <ids>". When the repository
# owner submits it, this enters those competitions now (workers/reenter.py -> workers/entrant.mjs), logs to
# data/entries/log_reenter.jsonl, refreshes the register and the site, comments the results and closes the issue.
# Issues from anyone else are ignored. Token-free.
name: reenter
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: reenter
  cancel-in-progress: false
jobs:
  reenter:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'reenter')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENTRANT_FIRST_NAME: ${{ secrets.ENTRANT_FIRST_NAME }}
      ENTRANT_LAST_NAME: ${{ secrets.ENTRANT_LAST_NAME }}
      ENTRANT_EMAIL: ${{ secrets.ENTRANT_EMAIL }}
      ENTRANT_PHONE: ${{ secrets.ENTRANT_PHONE }}
      ENTRANT_POSTCODE: ${{ secrets.ENTRANT_POSTCODE }}
      ENTRANT_SUBURB: ${{ secrets.ENTRANT_SUBURB }}
      ENTRANT_STATE: ${{ secrets.ENTRANT_STATE }}
      ENTRANT_ADDRESS: ${{ secrets.ENTRANT_ADDRESS }}
      ENTRANT_DOB: ${{ secrets.ENTRANT_DOB }}
      ENTRANT_LIVE: ${{ vars.ENTRANT_LIVE || '1' }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the re-entry queue
        run: python3 -m workers.reenter "$ISSUE_TITLE" > "$RUNNER_TEMP/reenter.json" && cat "$RUNNER_TEMP/reenter.json" | python3 -c "import json,sys; print(len(json.load(sys.stdin)), 'to enter')"
      - name: Install the browser
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0 > /dev/null
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium > /dev/null
      - name: Enter
        run: |
          touch data/entries/log_reenter.jsonl
          before=$(wc -l < data/entries/log_reenter.jsonl)
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" ENTRANT_QUEUE="$RUNNER_TEMP/reenter.json" \
            ENTRANT_LOG=data/entries/log_reenter.jsonl node workers/entrant.mjs
          tail -n +$((before + 1)) data/entries/log_reenter.jsonl > "$RUNNER_TEMP/results.jsonl"
          python3 -m workers.entry_queue
      - name: Commit, report and close the issue
        if: always()
        run: |
          bash workers/commit_entries.sh "reenter: issue #$ISSUE_NUMBER"
          summary=$(python3 -c "
          import json,sys
          rs=[json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          print('\n'.join(f\"- {r['id']}: {r['result']}{(' ('+r['reason']+')') if r.get('reason') else ''}\" for r in rs) or 'Nothing could be entered (closed, or not in the register).')
          " "$RUNNER_TEMP/results.jsonl" 2>/dev/null || echo "See the run log.")
          gh issue comment "$ISSUE_NUMBER" --body "Re-entry results:
          $summary"
          gh issue close "$ISSUE_NUMBER"
          gh workflow run site.yml --ref main || true
