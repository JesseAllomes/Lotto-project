# The owner's competition page (workers/site.py), published with GitHub Pages. Rebuilt after every comps or
# entries run, on pushes that change the data or the page, and every two hours as a fallback. Token-free.
# One-time setup by the owner: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: site
on:
  workflow_run:
    workflows: [comps, entries]
    types: [completed]
  push:
    branches: [main]
    paths: ["data/entries/**", "data/comps/**", "workers/site.py", ".github/workflows/site.yml"]
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build the page
        run: python3 -m workers.site --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
