# Competition register (workers/comps.py): adds each new open listing from competitions.com.au.
# Daily at 21:17 UTC (about 8:17am Melbourne in summer). Token-free; about one page a second.
name: comps
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: comps
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch new listings
        run: python3 -m workers.comps
      - name: Commit the register
        run: |
          git config user.name "lotto-comps-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comps
          git diff --cached --quiet || git commit -m "comps: register update $(date -u +%F)"
          git pull --rebase origin main
          git push
