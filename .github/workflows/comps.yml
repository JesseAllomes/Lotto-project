# Competition register (workers/comps.py, workers/source_auscomps.py): adds each new open listing from
# competitions.com.au and AusComps, then
# looks up ticket caps in promoters' terms (workers/comp_terms.py) and rebuilds the odds variables and the
# skill list (workers/comp_odds.py).
# Daily at 21:17 UTC (about 8:17am Melbourne in summer). Token-free; about one page a second.
name: comps
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: comps
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch new listings
        run: python3 -m workers.comps
      - name: Fetch new listings from AusComps (second source)
        run: python3 -m workers.source_auscomps
      - name: Ticket and entry caps from promoters' pages and terms
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null || true
          python3 -m workers.comp_terms
      - name: Entry types, odds variables and the skill list
        run: python3 -m workers.comp_odds --tags
      - name: Rank the skill competitions
        run: python3 -m analysis.skill_rank
      - name: Winners tracker (draw dates, how winners are told, surname check on published winners pages)
        env:
          ENTRANT_LAST_NAME: ${{ secrets.ENTRANT_LAST_NAME }}
        run: python3 -m workers.winners --check || true
      - name: Commit the register
        run: |
          git config user.name "lotto-comps-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comps data/entries/winners.csv
          git add data/entries/winner_checks.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "comps: register update $(date -u +%F)"
          # Other workers push while this runs: .jsonl registers merge by union (.gitattributes); regenerated CSVs and
          # summaries take this run's version.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 5))
          done
          exit 1
