# Auto-entry of free web-form competitions (m9). Every 3 hours (UTC 00:05, 03:05, ...) one job runs up to 5 rounds,
# about 5 minutes apart: each round rebuilds today's queue (workers/entry_queue.py decides what is due: bursts of 5
# per 3-hour window for comps with no stated limit, 4 a day where the terms flag excessive entries, the stated limit
# otherwise) and runs workers/entrant.mjs, which fills each form with the owner's details from secrets.
# Submits only when the repository variable ENTRANT_LIVE is 1; a dry run does one round. The repository is public:
# no screenshots are kept and nothing personal is logged (the log holds listing ids, results and field kinds).
name: entries
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: entries
  cancel-in-progress: false
jobs:
  enter:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ENTRANT_FIRST_NAME: ${{ secrets.ENTRANT_FIRST_NAME }}
      ENTRANT_LAST_NAME: ${{ secrets.ENTRANT_LAST_NAME }}
      ENTRANT_EMAIL: ${{ secrets.ENTRANT_EMAIL }}
      ENTRANT_PHONE: ${{ secrets.ENTRANT_PHONE }}
      ENTRANT_POSTCODE: ${{ secrets.ENTRANT_POSTCODE }}
      ENTRANT_SUBURB: ${{ secrets.ENTRANT_SUBURB }}
      ENTRANT_STATE: ${{ secrets.ENTRANT_STATE }}
      ENTRANT_ADDRESS: ${{ secrets.ENTRANT_ADDRESS }}
      ENTRANT_DOB: ${{ secrets.ENTRANT_DOB }}
      ENTRANT_LIVE: ${{ vars.ENTRANT_LIVE }}
      ENTRY_BURST: ${{ vars.ENTRY_BURST }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the queue and the manual list
        run: python3 -m workers.entry_queue
      - name: Install the browser
        if: env.ENTRANT_EMAIL != ''
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0 > /dev/null
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium > /dev/null
      - name: Enter (up to 5 rounds, about 5 minutes apart)
        if: env.ENTRANT_EMAIL != ''
        run: |
          rounds=1; [ "$ENTRANT_LIVE" = "1" ] && rounds=${ENTRY_BURST:-5}
          for i in $(seq 1 "$rounds"); do
            start=$(date +%s)
            python3 -m workers.entry_queue
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node workers/entrant.mjs
            if [ "$i" -lt "$rounds" ]; then
              wait=$(( 300 - ($(date +%s) - start) ))
              if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            fi
          done
          python3 -m workers.entry_queue
      - name: Commit the queue, manual list and log
        if: always()
        run: |
          git config user.name "lotto-entries-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries
          git diff --cached --quiet || git commit -m "entries: $(date -u +%F' '%H:%M)"
          git pull --rebase origin main
          git push
