# Auto-entry of free web-form competitions (m9). Every 3 hours (UTC 00:05, 03:05, ...) one job runs up to 5 rounds,
# about 5 minutes apart: each round rebuilds today's queue (workers/entry_queue.py decides what is due: bursts of 5
# per 3-hour window for comps with no stated limit, 4 a day where the terms flag excessive entries, the stated limit
# otherwise) and runs workers/entrant.mjs, which fills each form with the owner's details from secrets.
# Last day (owner, 2026-10-31): while any listing is in its final 24 hours and can take more entries, the chain runs
# hourly (data/entries/pace.json from entry_queue) and those listings get a burst every hour; stated limits stand.
# Self-chaining: after its burst a run commits the log, waits for the next 3-hour window and starts the next run
# itself (workflow_dispatch is allowed from GITHUB_TOKEN), because GitHub's scheduler can be hours late or drop
# runs; the cron stays as a backup that restarts the chain if it ever breaks. Unlimited minutes: the repo is public.
# Live by default (owner, 2026-10-30): set the repository variable ENTRANT_LIVE to 0 for a dry run (one round,
# nothing submitted), and ENTER_BANNED to 0 to stop entering comps whose terms ban automated entry. The repository is public:
# no screenshots are kept and nothing personal is logged (the log holds listing ids, results and field kinds).
name: entries
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: entries
  cancel-in-progress: false
jobs:
  enter:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ENTRANT_FIRST_NAME: ${{ secrets.ENTRANT_FIRST_NAME }}
      ENTRANT_LAST_NAME: ${{ secrets.ENTRANT_LAST_NAME }}
      ENTRANT_EMAIL: ${{ secrets.ENTRANT_EMAIL }}
      ENTRANT_PHONE: ${{ secrets.ENTRANT_PHONE }}
      ENTRANT_POSTCODE: ${{ secrets.ENTRANT_POSTCODE }}
      ENTRANT_SUBURB: ${{ secrets.ENTRANT_SUBURB }}
      ENTRANT_STATE: ${{ secrets.ENTRANT_STATE }}
      ENTRANT_ADDRESS: ${{ secrets.ENTRANT_ADDRESS }}
      ENTRANT_DOB: ${{ secrets.ENTRANT_DOB }}
      ENTRANT_LIVE: ${{ vars.ENTRANT_LIVE || '1' }}
      ENTER_BANNED: ${{ vars.ENTER_BANNED || '1' }}
      ENTRY_BURST: ${{ vars.ENTRY_BURST }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the queue and the manual list
        run: python3 -m workers.entry_queue
      - name: Install the browser
        if: env.ENTRANT_EMAIL != ''
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0 > /dev/null
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium > /dev/null
      - name: Enter (up to 5 rounds, about 5 minutes apart)
        if: env.ENTRANT_EMAIL != ''
        run: |
          rounds=1; [ "$ENTRANT_LIVE" = "1" ] && rounds=${ENTRY_BURST:-5}
          for i in $(seq 1 "$rounds"); do
            start=$(date +%s)
            python3 -m workers.entry_queue
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node workers/entrant.mjs
            if [ "$i" -lt "$rounds" ]; then
              wait=$(( 300 - ($(date +%s) - start) ))
              if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
            fi
          done
          python3 -m workers.entry_queue
      - name: Commit the queue, manual list and log
        if: always()
        run: bash workers/commit_entries.sh "entries: $(date -u +%F' '%H:%M)"
      - name: Refresh the website with the new entries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main || true
      - name: Wait for the next window (hourly while a comp is in its last day, else 3-hourly), then start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          step=$(python3 -c "import json; print(json.load(open('data/entries/pace.json'))['next_run_minutes'] * 60)" 2>/dev/null || echo 10800)
          next=$(( (now / step + 1) * step + 300 ))
          echo "sleeping $(( next - now ))s until $(date -u -d @$next +%H:%M) UTC"
          sleep $(( next - now ))
          gh workflow run entries.yml --ref main
